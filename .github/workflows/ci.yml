name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kaep
          POSTGRES_PASSWORD: kaep
          POSTGRES_DB: kaep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaep -d kaep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kaep:kaep@localhost:5432/kaep
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      AUTH_JWKS_URL: https://auth.invalid/.well-known/jwks.json
      AUTH_ISSUER: https://auth.invalid/
      AUTH_AUDIENCE: kaep-api

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TODO(D005): generate and commit pnpm-lock.yaml, then restore --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: M1 PostgreSQL integration
        run: pnpm --filter @kaep/api test:db
      - name: Readiness smoke
        run: |
          pnpm --filter @kaep/api dev > /tmp/kaep-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/readyz | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kaep-api.log
          exit 1
      - name: Browser MUR E2E
        run: |
          pnpm --filter @kaep/e2e exec playwright install --with-deps chromium
          pnpm --filter @kaep/e2e fixture > /tmp/kaep-e2e-fixture.log 2>&1 &
          FIXTURE_PID=$!
          AUTH_JWKS_URL=http://127.0.0.1:4100/jwks AUTH_ISSUER=http://127.0.0.1:4100/ AUTH_AUDIENCE=kaep-e2e \
            pnpm --filter @kaep/api exec tsx src/index.ts > /tmp/kaep-e2e-api.log 2>&1 &
          API_PID=$!
          KAEP_API_TARGET=http://127.0.0.1:3000 \
            pnpm --filter @kaep/web exec vite --host 127.0.0.1 --port 4173 > /tmp/kaep-e2e-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $FIXTURE_PID $API_PID $WEB_PID || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4100/health >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4100/health
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/healthz
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/
          pnpm --filter @kaep/e2e test:e2e
      - name: Upload MUR E2E evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mur-e2e-failure-evidence
          if-no-files-found: ignore
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
            /tmp/kaep-e2e-fixture.log
            /tmp/kaep-e2e-api.log
            /tmp/kaep-e2e-web.log
