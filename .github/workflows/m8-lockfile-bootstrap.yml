name: M8 Lockfile Bootstrap

on:
  push:
    branches:
      - aegis/mur-m8-release-hardening-148

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Commit deterministic lockfile once
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "kaep-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(release): commit deterministic pnpm lockfile"
          git push origin HEAD:aegis/mur-m8-release-hardening-148
