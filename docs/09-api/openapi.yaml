openapi: 3.1.0
info:
  title: Kurumsal AI Egitim Platformu API
  version: 0.1.1-design-freeze
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Organization
  - name: Training
  - name: Learning
  - name: QuestionBank
  - name: Assessment
  - name: Certification
  - name: AI
  - name: Analytics
  - name: Notification
  - name: Audit
paths:
  /me:
    get: {tags: [Identity], operationId: getMe, responses: {'200': {$ref: '#/components/responses/Ok'}, '401': {$ref: '#/components/responses/Error'}}}
  /organization:
    get: {tags: [Organization], operationId: getOrganization, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /organization/units:
    get: {tags: [Organization], operationId: listOrganizationUnits, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /users:
    get: {tags: [Identity], operationId: listUsers, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /users/invitations:
    post:
      tags: [Identity]
      operationId: inviteUser
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    patch: {tags: [Identity], operationId: updateUser, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /roles:
    get: {tags: [Identity], operationId: listRoles, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /users/{userId}/roles:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    put: {tags: [Identity], operationId: replaceUserRoles, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /trainings:
    get: {tags: [Training], operationId: listTrainings, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Training], operationId: createTraining, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}, '403': {$ref: '#/components/responses/Error'}}}
  /trainings/{trainingId}:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    get: {tags: [Training], operationId: getTraining, responses: {'200': {$ref: '#/components/responses/Ok'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {tags: [Training], operationId: updateTraining, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /trainings/{trainingId}/submit-review:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    post: {tags: [Training], operationId: submitTrainingReview, responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /trainings/{trainingId}/publish:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    post: {tags: [Training], operationId: publishTraining, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /trainings/{trainingId}/archive:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    post: {tags: [Training], operationId: archiveTraining, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /trainings/{trainingId}/versions:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    get: {tags: [Training], operationId: listTrainingVersions, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Training], operationId: createTrainingVersion, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /trainings/{trainingId}/objectives:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    get: {tags: [Training], operationId: listLearningObjectives, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Training], operationId: createLearningObjective, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /learning-objectives/{objectiveId}:
    parameters: [{$ref: '#/components/parameters/ObjectiveId'}]
    patch: {tags: [Training], operationId: updateLearningObjective, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /trainings/{trainingId}/modules:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    get: {tags: [Training], operationId: listTrainingModules, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Training], operationId: createTrainingModule, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /content/sources:
    post: {tags: [Training], operationId: createContentSource, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /content/{contentId}/versions:
    parameters: [{$ref: '#/components/parameters/ContentId'}]
    post: {tags: [Training], operationId: createContentVersion, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /assignments:
    get: {tags: [Learning], operationId: listAssignments, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Learning], operationId: createAssignment, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}, '409': {$ref: '#/components/responses/Error'}}}
  /learner/assignments:
    get: {tags: [Learning], operationId: listMyAssignments, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /learner/trainings/{trainingId}:
    parameters: [{$ref: '#/components/parameters/TrainingId'}]
    get: {tags: [Learning], operationId: getMyTraining, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /learner/progress/{trainingVersionId}:
    parameters: [{$ref: '#/components/parameters/TrainingVersionId'}]
    put: {tags: [Learning], operationId: updateMyTrainingProgress, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /learner/modules/{moduleId}/progress:
    parameters: [{$ref: '#/components/parameters/ModuleId'}]
    put: {tags: [Learning], operationId: updateMyModuleProgress, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /learner/videos/{videoId}/progress:
    parameters: [{$ref: '#/components/parameters/VideoId'}]
    put: {tags: [Learning], operationId: updateMyVideoProgress, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /learner/trainings/{trainingVersionId}/resume:
    parameters: [{$ref: '#/components/parameters/TrainingVersionId'}]
    get: {tags: [Learning], operationId: getMyResumePosition, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /questions:
    get: {tags: [QuestionBank], operationId: listQuestions, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [QuestionBank], operationId: createQuestion, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /questions/{questionId}:
    parameters: [{$ref: '#/components/parameters/QuestionId'}]
    get: {tags: [QuestionBank], operationId: getQuestion, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    patch: {tags: [QuestionBank], operationId: updateQuestion, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /questions/{questionId}/submit-review:
    parameters: [{$ref: '#/components/parameters/QuestionId'}]
    post: {tags: [QuestionBank], operationId: submitQuestionReview, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /questions/{questionId}/approve:
    parameters: [{$ref: '#/components/parameters/QuestionId'}]
    post: {tags: [QuestionBank], operationId: approveQuestion, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /questions/{questionId}/retire:
    parameters: [{$ref: '#/components/parameters/QuestionId'}]
    post: {tags: [QuestionBank], operationId: retireQuestion, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /assessments:
    get: {tags: [Assessment], operationId: listAssessments, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    post: {tags: [Assessment], operationId: createAssessment, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {$ref: '#/components/responses/Created'}}}
  /assessments/{assessmentId}:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}]
    get: {tags: [Assessment], operationId: getAssessment, responses: {'200': {$ref: '#/components/responses/Ok'}}}
    patch: {tags: [Assessment], operationId: updateAssessment, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /assessments/{assessmentId}/publish:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}]
    post: {tags: [Assessment], operationId: publishAssessment, responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /assessments/{assessmentId}/close:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}]
    post: {tags: [Assessment], operationId: closeAssessment, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /assessments/{assessmentId}/attempts:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}]
    post: {tags: [Assessment], operationId: startAttempt, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {$ref: '#/components/responses/Created'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /attempts/{attemptId}:
    parameters: [{$ref: '#/components/parameters/AttemptId'}]
    get: {tags: [Assessment], operationId: getAttempt, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /attempts/{attemptId}/answers/{questionSnapshotId}:
    parameters: [{$ref: '#/components/parameters/AttemptId'}, {$ref: '#/components/parameters/QuestionSnapshotId'}]
    put: {tags: [Assessment], operationId: saveAttemptAnswer, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /attempts/{attemptId}/submit:
    parameters: [{$ref: '#/components/parameters/AttemptId'}]
    post: {tags: [Assessment], operationId: submitAttempt, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Ok'}, '409': {$ref: '#/components/responses/Error'}}}
  /attempts/{attemptId}/result:
    parameters: [{$ref: '#/components/parameters/AttemptId'}]
    get: {tags: [Assessment], operationId: getAttemptResult, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /assessments/{assessmentId}/retake-requests:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}]
    post: {tags: [Assessment], operationId: requestRetake, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'201': {$ref: '#/components/responses/Created'}}}
  /retake-requests/{requestId}/approve:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post: {tags: [Assessment], operationId: approveRetake, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /retake-requests/{requestId}/reject:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post: {tags: [Assessment], operationId: rejectRetake, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /learner/certificates:
    get: {tags: [Certification], operationId: listMyCertificates, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /certificates/{certificateId}:
    parameters: [{$ref: '#/components/parameters/CertificateId'}]
    get: {tags: [Certification], operationId: getCertificate, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /certificates/verify/{verificationCode}:
    parameters: [{$ref: '#/components/parameters/VerificationCode'}]
    get: {tags: [Certification], operationId: verifyCertificate, security: [], responses: {'200': {$ref: '#/components/responses/Ok'}, '404': {$ref: '#/components/responses/Error'}}}
  /certificates/{certificateId}/revoke:
    parameters: [{$ref: '#/components/parameters/CertificateId'}]
    post: {tags: [Certification], operationId: revokeCertificate, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /ai/content-intelligence/jobs:
    post: {tags: [AI], operationId: createContentIntelligenceJob, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'202': {$ref: '#/components/responses/Accepted'}}}
  /ai/question-generation/jobs:
    post: {tags: [AI], operationId: createQuestionGenerationJob, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'202': {$ref: '#/components/responses/Accepted'}}}
  /ai/jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get: {tags: [AI], operationId: getAiJob, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /ai/reviews:
    get: {tags: [AI], operationId: listAiReviews, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /ai/reviews/{reviewId}/approve:
    parameters: [{$ref: '#/components/parameters/ReviewId'}]
    post: {tags: [AI], operationId: approveAiReview, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /ai/reviews/{reviewId}/reject:
    parameters: [{$ref: '#/components/parameters/ReviewId'}]
    post: {tags: [AI], operationId: rejectAiReview, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /analytics/organization:
    get: {tags: [Analytics], operationId: getOrganizationAnalytics, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
  /analytics/learner/me:
    get: {tags: [Analytics], operationId: getMyLearningAnalytics, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /analytics/learner/me/weak-areas:
    get: {tags: [Analytics], operationId: getMyWeakAreas, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /notifications:
    get: {tags: [Notification], operationId: listMyNotifications, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /notifications/{notificationId}/read:
    parameters: [{$ref: '#/components/parameters/NotificationId'}]
    post: {tags: [Notification], operationId: markNotificationRead, responses: {'200': {$ref: '#/components/responses/Ok'}}}
  /audit/events:
    get: {tags: [Audit], operationId: listAuditEvents, responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    TrainingId: {name: trainingId, in: path, required: true, schema: {type: string, format: uuid}}
    TrainingVersionId: {name: trainingVersionId, in: path, required: true, schema: {type: string, format: uuid}}
    ObjectiveId: {name: objectiveId, in: path, required: true, schema: {type: string, format: uuid}}
    ContentId: {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
    ModuleId: {name: moduleId, in: path, required: true, schema: {type: string, format: uuid}}
    VideoId: {name: videoId, in: path, required: true, schema: {type: string, format: uuid}}
    QuestionId: {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    AssessmentId: {name: assessmentId, in: path, required: true, schema: {type: string, format: uuid}}
    AttemptId: {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    QuestionSnapshotId: {name: questionSnapshotId, in: path, required: true, schema: {type: string, format: uuid}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    CertificateId: {name: certificateId, in: path, required: true, schema: {type: string, format: uuid}}
    VerificationCode: {name: verificationCode, in: path, required: true, schema: {type: string, minLength: 16}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  schemas:
    GenericObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string}
        details: {type: object, additionalProperties: true}
  responses:
    Ok:
      description: OK
      content: {application/json: {schema: {$ref: '#/components/schemas/GenericObject'}}}
    Created:
      description: Created
      content: {application/json: {schema: {$ref: '#/components/schemas/GenericObject'}}}
    Accepted:
      description: Accepted
      content: {application/json: {schema: {$ref: '#/components/schemas/GenericObject'}}}
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
